name: CI

on:
  push:
    branches: [medtrace-pipeline, master]
  pull_request:
    branches: [medtrace-pipeline, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_API_BASE: mock://        # offline mock only; CI has no .env and never reaches a real endpoint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # competition unified runtime (tech spec 附件3)
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (includes the submission-package smoke test)
        run: python -m unittest discover -s tests -v