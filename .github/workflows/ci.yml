name: CI

on:
  push:
    branches: [medtrace-pipeline, master]
  pull_request:
    branches: [medtrace-pipeline, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    env:
      LLM_API_BASE: mock://        # offline mock only; CI has no .env and never reaches a real endpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (includes the submission-package smoke test)
        run: python -m unittest discover -s tests -v