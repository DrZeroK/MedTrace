name: CI

on:
  push:
    branches: [medtrace-pipeline, master, 'codex/**']
  pull_request:
    branches: [medtrace-pipeline, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [pinned, stdlib]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # competition unified runtime (tech spec 附件3)
      - name: Install dependencies
        if: matrix.dependencies == 'pinned'
        run: python -m pip install -r requires.txt
      - name: Run tests (includes the submission-package smoke test)
        if: matrix.dependencies == 'pinned'
        run: python -m unittest discover -s tests -v
      - name: Run without site packages
        if: matrix.dependencies == 'stdlib'
        run: python -S -m unittest discover -s tests -v
